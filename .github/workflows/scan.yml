name: closure watch

on:
  schedule:
    # Every 3 hours, same slots as disney-menu-watch.
    # Anchored on 13:00 UTC (6am Pacific daylight).
    # 6a / 9a / 12p / 3p / 6p / 9p / 12a / 3a Pacific daylight time.
    - cron: '0 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: closure-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sweep both resorts
        run: node scan.mjs

      - name: Commit the snapshot
        run: |
          git config user.name "closure-watch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data
          if git diff --staged --quiet; then
            echo "Nothing changed in data/"
          else
            git commit -m "closure snapshot $(date -u +%F' '%H:%M)"
            git pull --rebase --autostash
            git push
          fi

      - name: Post summary if there's news
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EV=$(cat events.txt 2>/dev/null || echo 0)
          if [ ! -f POST_COMMENT ] && [ "$EV" = "0" ]; then
            echo "No closure changes this run — skipping comment."
            exit 0
          fi
          NUM=$(gh issue list --label closure-log --state open --limit 1 --json number -q '.[0].number')
          if [ -z "$NUM" ]; then
            gh label create closure-log --color 0E8A16 --description "attraction closure watch" || true
            URL=$(gh issue create --title "Attraction closure watch - alert log" \
              --label closure-log \
              --body "Comments post only when a scan finds a new, extended, shortened, or reopened closure. Quiet runs stay silent.")
            NUM=$(basename "$URL")
          fi
          {
            echo "@scoopdisney"
            echo ""
            cat summary.md
          } > comment-body.md
          gh issue comment "$NUM" --body-file comment-body.md
          echo "posted to issue #$NUM"
